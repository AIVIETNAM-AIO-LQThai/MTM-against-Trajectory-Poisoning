experiment:
  group: 2
  phase: attack_reproduction
  development_only: true

dataset:
  name: walker2d-medium-v2

  # Must match Group-1 clean dataset.
  immutable_clean_dataset: true

attack:
  name: csdpc
  enabled: true

  representation:
    type: raw_state_action

    # The publication describes raw (s,a) clustering but does not
    # specify an additional normalization procedure for this setting.
    preprocessing: none
    preprocessing_status: REPRODUCTION_CHOICE_SOURCE_UNDERSPECIFIED

  clustering:
    method: kmeans
    num_clusters: 8
    cluster_selection: elbow_method

    # Source-under-specified operational details frozen before
    # downstream attack outcomes are inspected.
    init: k-means++
    n_init: 10
    max_iter: 300
    tolerance: 1.0e-4
    algorithm: lloyd

    random_state_from_attack_seed: true

  pattern:
    # Exactly five decision-unit positions; see source-audit note
    # regarding the paper's indexing inconsistency.
    sequence_length: 5
    deduplicate_after_windowing: true
    remove_consecutive_duplicates: true
    respect_episode_boundaries: true

    frequency_definition: occurrence_count

  selection:
    ordering: ascending_pattern_frequency

    tie_break:
      pattern: lexicographic
      occurrence:
        - trajectory_id
        - global_start

    allow_overlapping_windows: false
    partial_windows: false

    target_pattern_objective: maximize_resulting_pattern_frequency


  perturbation:
    magnitude: 0.05
    norm: linf_relative

    state_constraint: "||zeta_s||_inf <= eta * ||s||_inf"
    action_constraint: "||zeta_a||_inf <= eta * ||a||_inf"

    candidate_generation: seeded_uniform
    num_candidates: 100

    candidate_selection:
      primary: resulting_clean_pattern_frequency
      maximize: true
      tie_break:
        - total_linf_perturbation
        - candidate_index

    state_clipping: none

    action_clipping:
      enabled: true
      low: -1.0
      high: 1.0

    random_state_from_attack_seed: true

  budget:
    rates:
      - 0.00
      - 0.01
      - 0.05

    denominator: transitions
    rounding: floor
    count_unique_modified_transitions: true
    allow_budget_exceedance: false

    requested_and_actual_rate_recorded: true

  seeds:
    - 0
    - 1
    - 2

preservation:
  rewards: true
  terminals: true
  timeouts: true
  trajectory_boundaries: true
  number_of_transitions: true

output:
  save_poison_metadata: true
  save_dataset_hashes: true
  save_modified_indices: true
  save_original_values: true
  save_poisoned_values: true