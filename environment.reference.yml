name: dt-reference
channels:
  - pytorch
  - defaults

# Historical Decision Transformer reference stack.
# Before Gate A, record the exact local D4RL revision, MuJoCo binary,
# CUDA driver/runtime, and export the fully resolved environment.
dependencies:
  - python=3.8.5
  - numpy=1.20.3
  - pytorch=1.8.1
  - cudatoolkit=10
  - pip
  - pip:
      - gym==0.18.3
      - mujoco-py==2.0.2.13
      - transformers==4.5.1
      # D4RL revision must be explicitly resolved before Gate A.
